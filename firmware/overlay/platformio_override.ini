; CC1101 node overlay — build env for the ESP32-C3 SuperMini + CC1101 Tasmota node.
; Copied to the Tasmota checkout root by build.py. Upstream env tasmota32c3 already sets
; -DUSE_USB_CDC_CONSOLE via boards/esp32c3.json (native USB console).
;
; BOOT-SAFETY (see firmware/docs/bootloader-recovery.md): this env MUST keep extending
; env:tasmota32c3, whose `board = esp32c3` selects the native USB-Serial-JTAG console. Do NOT
; switch to tasmota32c3ser / board esp32c3ser (UART-only) — a node with no USB console cannot be
; recovered after it goes dark. Do NOT add secure-boot, flash-encryption, or ROM-download-disable
; build flags/eFuse steps here: they can permanently remove the BOOT-button esptool recovery path.
; user_config_override.h carries #error guards that fail the build if any of these regress.
[platformio]
default_envs            = tasmota32c3-cc1101

[env:tasmota32c3-cc1101]
extends                 = env:tasmota32c3
build_flags             = ${env:tasmota32c3.build_flags}
                          -DUSE_CONFIG_OVERRIDE
                          -DCODE_IMAGE_STR='"cc1101-node"'
