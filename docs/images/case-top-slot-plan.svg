<text x="128.50" y="232.50" font-size="1.65" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">   C is y = <tspan data-dim="out_y0">-2.70</tspan>.</text>
<text x="128.50" y="235.10" font-size="1.65" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">Views are independent, each captioned with its viewing direction; they are not arranged in</text>
<text x="128.50" y="237.70" font-size="1.65" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">   projection.</text>
<text x="128.50" y="240.30" font-size="1.65" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">Tolerance: ±<tspan data-const="TOL_LINEAR">0.2</tspan> linear; ±<tspan data-const="TOL_SNAP">0.1</tspan> on snap and peg features; heights ±<tspan data-const="TOL_Z">0.1</tspan> (half a <tspan data-const="LAYER_H">0.2</tspan> mm layer).</text>
<text x="128.50" y="242.90" font-size="1.65" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">Print orientation as supplied (open side up). The Ø<tspan data-dim="bore_d_1">2.60</tspan> boss bore is a minimum limit. No draft is</text>
