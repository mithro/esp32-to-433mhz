<text x="128.50" y="224.70" font-size="1.65" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">Datums: A the outside bottom face, B the USB-C wall's outer face, C the J4-end outer face. Numbers</text>
