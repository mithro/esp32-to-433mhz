<text x="132.50" y="215.90" font-size="1.80" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">All dimensions from the model (scripts/case_dims.py); no draft angles modelled.</text>
<text x="132.50" y="218.50" font-size="1.80" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">Tolerance: FDM print +/-0.2 unless noted; snap and peg features +/-0.05 as modelled.</text>
<text x="132.50" y="221.10" font-size="1.80" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">Frame: x right, y down from the PCB's top-left corner, z up from the PCB's top face.</text>
<rect x="1.50" y="198.50" width="129.00" height="25.00" rx="0.00" fill="none" stroke="#1a1a2e" stroke-width="0.50"/>
<text x="3.50" y="201.90" font-size="2.30" font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#1a1a2e" text-anchor="start" dy="0.35em">NOTES for an injection-moulded or machined version</text>
<text x="3.50" y="205.90" font-size="1.90" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">1. No draft is modelled: add 1-2° on every face parallel to the pull (walls, standoffs, bosses, pegs).</text>
<text x="3.50" y="208.60" font-size="1.90" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">2. Internal corners are sharp (only the vertical outside corners are R2): add R0.3-0.5 at wall/floor and boss roots.</text>
<text x="3.50" y="211.30" font-size="1.90" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">3. Walls 2.2, plates 2.0 (antenna wall 2.5); the Ø4.0 standoffs and Ø4.4 bosses on 2 mm plates will sink: core or accept.</text>
<text x="3.50" y="214.00" font-size="1.90" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">4. The tab bumps and skirt grooves are undercuts to a z pull: side actions or lifters, or accept a 0.2 mm bump-off.</text>
<text x="3.50" y="216.70" font-size="1.90" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">5. The Ø2.15 pegs rely on FDM printing oversize to grip the Ø2.2 holes: size a true interference, or use inserts and screws.</text>
<text x="3.50" y="219.40" font-size="1.90" font-family="Helvetica, Arial, sans-serif" font-weight="normal" fill="#1a1a2e" text-anchor="start" dy="0.35em">6. Aluminium: 0.8 mm tabs cannot flex; use M2 screws through the bosses into tapped standoffs, and R1+ internal corners.</text>
</svg>
