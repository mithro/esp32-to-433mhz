name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boards:
    name: Verify boards and build manufacturing packages
    runs-on: ubuntu-latest
    container:
      # Same KiCad version as the boards were generated with, so the
      # regenerate check (including zone fills) compares byte for byte.
      image: kicad/kicad:9.0.7
      options: --user root
    outputs:
      describe: ${{ steps.describe.outputs.describe }}
      tag: ${{ steps.describe.outputs.tag }}
    steps:
      - name: Install git and zip
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git zip > /dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags for git describe

      - name: Give kicad-cli the stock global library tables
        # A fresh container has no KiCad user config; ERC then warns that the
        # (embedded) symbols' library is not configured.
        run: |
          mkdir -p "$HOME/.config/kicad/9.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/9.0/"

      - name: Describe the commit
        id: describe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "describe=$(git describe --tags --dirty --always --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"

      - name: Regenerate the boards and check they match the commit
        run: |
          for g in supermini sx1278 cc1101 adapters; do python3 scripts/generate_$g.py > /dev/null; done
          python3 scripts/fill_zones.py
          git status --short
          git diff --exit-code

      - name: ERC and DRC (with schematic parity)
        run: python3 scripts/verify_boards.py

      - name: Build manufacturing packages
        run: python3 scripts/export_manufacturing.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: manufacturing-packages-${{ steps.describe.outputs.describe }}
          path: dist/*

  release:
    name: Publish packages on the release
    needs: boards
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.boards.outputs.tag }}
      DESCRIBE: ${{ needs.boards.outputs.describe }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manufacturing-packages-${{ needs.boards.outputs.describe }}
          path: dist

      # Every push to main refreshes the release of the latest version tag:
      # it is renamed to the full `git describe` of the build and its assets
      # are replaced.  No tags are created by CI.
      - name: Create or update the release
        run: |
          printf '\nBuilt from commit %s on `main`.\n' "$GITHUB_SHA" >> dist/RELEASE_NOTES.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | xargs -r -n1 gh release delete-asset "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$DESCRIBE" --notes-file dist/RELEASE_NOTES.md --latest
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*.zip dist/SHA256SUMS
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$DESCRIBE" --notes-file dist/RELEASE_NOTES.md --latest dist/*.zip dist/SHA256SUMS
          fi
