name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  boards:
    name: Verify boards and build manufacturing packages
    runs-on: ubuntu-latest
    container:
      # Same KiCad version as the boards were generated with, so the
      # regenerate check (including zone fills) compares byte for byte.
      image: kicad/kicad:9.0.7
      options: --user root
    steps:
      - name: Install git and zip
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git zip > /dev/null

      - uses: actions/checkout@v4

      - name: Give kicad-cli the stock global library tables
        # A fresh container has no KiCad user config; ERC then warns that the
        # (embedded) symbols' library is not configured.
        run: |
          mkdir -p "$HOME/.config/kicad/9.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/9.0/"

      - name: Regenerate the boards and check they match the commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for g in supermini sx1278 cc1101 adapters; do python3 scripts/generate_$g.py > /dev/null; done
          python3 scripts/fill_zones.py
          git status --short
          git diff --exit-code

      - name: ERC and DRC (with schematic parity)
        run: python3 scripts/verify_boards.py

      - name: Build manufacturing packages
        run: python3 scripts/export_manufacturing.py --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: manufacturing-packages
          path: dist/*

      - name: Publish release packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
